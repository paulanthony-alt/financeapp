name: Probe IPO check (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run IPO check against real data
        env:
          IPO_EXTRA: Reddit,Rubrik,Arm Holdings,Instacart
        run: node scripts/fetch-ipo-status.mjs /tmp/ipo-status.json && head -c 3000 /tmp/ipo-status.json
